.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.form{margin-bottom:14px}.err{color:var(--rink);font-size:14px;margin-top:8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:10px 0;font-size:14px}dt{color:var(--mut)}dd{margin:0}

</style>
</head>

 const sn=t.split(/(?<=[.!?])\s+|\n+/),f=re=>sn.find(x=>re.test(x))||"Not mentioned";
 const doms=[[/golf/i,"Golf"],[/sport/i,"Sports"],[/hospitality/i,"Hospitality"],[/festival|music/i,"Festivals"],[/corporate|summit|expo|conference/i,"Corporate"],[/international|global/i,"International events"]].filter(x=>x[0].test(t)).map(x=>x[1]);
 return{from,to,city:Object.keys(CITY).find(c=>new RegExp("\\b"+c+"\\b","i").test(t)),roles:T.filter(x=>new RegExp(x.n,"i").test(t)).map(x=>({...x,d:doms.length?doms:x.d})),notes:[["Production",f(/stage|rigging|power/i)],["Accommodation",f(/accommodation|hotel/i)],["Travel",f(/shuttle|flight|transfers?/i)],["Equipment",f(/equipment|radios?|generators?/i)],["Deadline",f(/deadline|confirm/i)]]}}
function briefTab(){
 const e=S.ex;let out="";
 if(e)out='<h2 style="margin-top:8px">Extracted from the brief</h2><dl><dt>Dates</dt><dd>'+(e.from?rng(e.from,e.to):'Not found')+'</dd><dt>Location</dt><dd>'+(e.city||'Not found')+'</dd><dt>Roles</dt><dd>'+(e.roles.map(r=>r.t).join(", ")||'None found')+'</dd>'+e.notes.map(n=>'<dt>'+n[0]+'</dt><dd>'+esc(n[1])+'</dd>').join("")+'</dl>'+(e.roles.length?'<h2>Jobs to post</h2>'+e.roles.map(p=>{const have=S.roles.some(r=>r.t===p.t&&r.from===e.from);return'<label class="pr"><input type="checkbox" data-pick="'+p.t+'"'+(have?' disabled checked':S.pick[p.t]?' checked':'')+'><span><b>'+p.t+'</b> '+(have?'<span class="badge b-open">Already posted</span>':'')+'<br><span class="mut">Up to £'+p.r+'/day</span><br>'+tags(p.s)+tags(p.d)+'</span></label>'}).join("")+'<div class="acts"><button class="btn" data-add'+(e.from?'':' disabled')+'>Post selected jobs</button></div>'+(e.from?'':'<p class="err">Add event dates to the brief, such as 3–12 November 2026.</p>'):'<p class="mut">No roles found. Name the roles you need, such as Site Manager or Logistics.</p>');
 return'<section class="card"><h2>Turn an event brief into job listings</h2><p class="mut" style="margin:4px 0 12px">Upload a brief or paste it. Talent Match pulls out the dates, location, roles and logistics, then drafts a job for each role.</p><label class="fld"><span>Upload a brief (.docx, .txt or .md)</span><input type="file" data-file accept=".docx,.txt,.md"></label>'+(S.msg?'<p class="mut" style="margin-top:6px">'+esc(S.msg)+'</p>':'')+'<label class="fld" style="margin-top:12px"><span>Or paste it here</span><textarea id="brief" placeholder="Paste your event brief here">'+esc(S.brief)+'</textarea></label><div class="acts"><button class="btn" data-parse>Extract requirements</button><button class="btn alt" data-sample>Use sample brief</button></div>'+out+'</section>'}
function render(){head();$("#app").innerHTML=S.tab==="jobs"?jobsTab():S.tab==="roster"?rosterTab():S.tab==="brief"?briefTab():S.tab==="client"?clientTab():boardTab()}
function invite(j,f){const k=key(j,f);if(S.inv[k]||S.app[k]==="accepted")return;S.inv[k]="sent";const ok=sc(f,j).full;
 setTimeout(()=>{S.inv[k]=ok?"yes":"no";$("#live").textContent=f.n+(ok?" is available and booked.":" is not available.");render()},900)}
document.addEventListener("click",e=>{
 const q=s=>e.target.closest(s),d=s=>q(s).dataset,j=cur();
 if(q("[data-tab]")){S.tab=d("[data-tab]").tab;S.err=""}
 else if(q("[data-jt]"))S.jt=d("[data-jt]").jt;
 else if(q("[data-role]")){S.sel=+d("[data-role]").role;S.cp=S.ca=0}
 else if(q("[data-inv]")){S.ca=0;S.cp=+d("[data-inv]").inv;S.cx={a:0,b:0,c:0,e:0};S.err="";setTimeout(()=>{const p=$("[role=dialog]");p&&p.scrollIntoView&&p.scrollIntoView({block:"nearest"})},0)}
 else if(q("[data-send]")){const x=S.cx;if(!(x.a&&x.b&&x.c&&x.e))S.err="Tick every item before sending.";else{invite(j,F.find(f=>f.id===S.cp));S.cp=0;S.err=""}}
 else if(q("[data-acc]")){S.cp=0;S.ca=+d("[data-acc]").acc;S.cy={a:0,b:0,c:0,d:0};S.err="";setTimeout(()=>{const p=$("[role=dialog]");p&&p.scrollIntoView&&p.scrollIntoView({block:"nearest"})},0)}
 else if(q("[data-accept]")){const f=F.find(x=>x.id===S.ca);if(!acceptItems(j,f).every(i=>S.cy[i[0]]))S.err="Tick every item before accepting.";else{S.app[j.id+":"+f.id]="accepted";S.ca=0;S.err="";$("#live").textContent=f.n+" accepted and booked."}}
 else if(q("[data-dec]"))S.app[j.id+":"+d("[data-dec]").dec]="declined";
 else if(q("[data-apply]")){S.ap=+d("[data-apply]").apply;S.ac.ok=false;S.err="";setTimeout(()=>{const p=$("[role=dialog]");p&&p.scrollIntoView&&p.scrollIntoView({block:"nearest"})},0)}
 else if(q("[data-confirm]")){if(!S.ac.ok)S.err="Tick the box to confirm you understand.";else{S.app[S.ap+":"+S.as]="applied";S.ap=0;S.err="";$("#live").textContent="Application sent."}}
 else if(q("[data-save]")){const f=F.find(f=>f.id===+d("[data-save]").save);f.saved=f.saved?0:1}
 else if(q("[data-ch]")){const x=d("[data-ch]"),a=S[x.ch][x.k],i=a.indexOf(x.v);i<0?a.push(x.v):a.splice(i,1)}
 else if(q("[data-ck]")){}
 else if(q("[data-savec]")){const c=S.cl;
  if(!c.name.trim()||!c.contact.trim()||!c.email.trim()||!c.ra.trim())S.err="Add your company name, main contact, email and registered address.";
  else if(!c.crn.trim()||!c.crf)S.err="Add your company registration number and upload proof of registration.";
  else if(c.vat&&!c.vn.trim())S.err="Add your VAT number, or choose Not VAT registered.";
  else if(!c.agree)S.err="Agree to the client terms and conditions to save your profile.";
  else{c.saved=1;S.err="";try{localStorage.setItem("tm-client",JSON.stringify(c))}catch(e){}}}
 else if(q("[data-newreq]")){if(S.cl.saved){S.rform=1;S.err=""}else{S.tab="client";S.err="Complete and save your client profile, and agree to the client terms, before posting jobs."}}
 else if(q("[data-newf]")){S.fform=1;S.err=""}
 else if(q("[data-cancel]")){S.rform=S.fform=S.ap=S.cp=S.ca=0;S.err=""}
 else if(q("[data-saver]")){const f=S.rf;
  if(!f.t.trim()||!f.from||!f.to||+f.r<=0)S.err="Add a job title, dates and a day rate.";
  else if(dn(f.to)<dn(f.from))S.err="The end date must be on or after the start date.";
  else{S.roles.push({id:++S.nid,t:f.t.trim(),city:f.city,from:dn(f.from),to:dn(f.to),r:+f.r,desc:f.desc.trim(),s:[...f.s],d:[...f.d]});S.sel=S.nid;S.rform=0;S.err="";S.jt="saved"}}
 else if(q("[data-addbusy]")){const f=S.pf;if(f.bf&&f.bt&&dn(f.bt)>=dn(f.bf)){f.busy.push([dn(f.bf),dn(f.bt)]);f.bf=f.bt="";S.err=""}else S.err="Pick a start and end date for the booked period."}
 else if(q("[data-savef]")){const f=S.pf;
  if(!f.n.trim()||+f.rate<=0)S.err="Add a name and a day rate.";
  else if(f.vat&&!f.vn.trim())S.err="Add the VAT number, or choose Not VAT registered.";
  else if(f.biz==="business"&&!f.crf)S.err="Upload proof of your company registration.";
  else if(f.rtw.length&&!f.rtwf)S.err="Upload proof of your right to work.";
  else if(!f.agree)S.err="Agree to the terms and conditions to create your profile.";
  else{F.push({id:F.length+1,n:f.n.trim(),h:f.h.trim()||"Freelancer",city:f.city,intl:f.intl,s:[...f.s],d:[...f.d],rate:+f.rate,rating:0,jobs:0,busy:[...f.busy],pp:!!f.ppn.trim(),lic:[f.drv&&"Driver’s licence",f.fork&&"Forklift licence",f.lico.trim()].filter(Boolean),biz:f.biz==="business"?f.bs+(f.bn.trim()?" · "+f.bn.trim():""):"Individual",vat:f.vat?f.vn.trim():"",novat:!f.vat,co:f.co,rtw:[...f.rtw],visa:f.visa,reg:!!f.crf,terms:1});S.pf=blank();S.fform=0;S.err=""}}
 else if(q("[data-sample]")){S.brief=SAMPLE;S.ex=null;S.msg=""}
 else if(q("[data-parse]")){S.brief=$("#brief").value;S.ex=parse(S.brief);S.pick={};S.ex.roles.forEach(p=>{S.pick[p.t]=true})}
 else if(q("[data-add]")&&!S.cl.saved){S.tab="client";S.err="Complete and save your client profile, and agree to the client terms, before posting jobs."}
 else if(q("[data-add]")){const x=S.ex,add=x.roles.filter(p=>S.pick[p.t]&&!S.roles.some(r=>r.t===p.t&&r.from===x.from)),n=x.notes.filter(a=>a[1]!=="Not mentioned").map(a=>a[1]).join(" ");
  add.forEach(p=>S.roles.push({id:++S.nid,t:p.t,city:x.city||"London",from:x.from,to:x.to,r:p.r,desc:n,s:p.s,d:p.d}));if(add.length){S.sel=S.nid-add.length+1;S.tab="jobs";S.jt="saved"}}
 else return;
 render()});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id==="brief")S.brief=t.value;
 else if(t.dataset.q!==undefined){S.q=t.value;$("#lst").innerHTML=cands(cur(),"search")}
 else if(t.dataset.jq!==undefined){S.jq=t.value;render();const e2=$("[data-jq]");e2.focus();e2.setSelectionRange(e2.value.length,e2.value.length)}
 else if(t.dataset.f){S[t.dataset.f][t.dataset.k]=t.type==="checkbox"?t.checked:t.value;if(t.dataset.f==="cl")S.cl.saved=0}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.pick)S.pick[t.dataset.pick]=t.checked;
 else if(t.dataset.r!==undefined)render();
 else if(t.dataset.as!==undefined){S.as=+t.value;render()}
 else if(t.dataset.up!==undefined){S.pf[t.dataset.up]=t.files[0]?t.files[0].name:"";render()}
 else if(t.dataset.upc!==undefined){S.cl[t.dataset.upc]=t.files[0]?t.files[0].name:"";S.cl.saved=0;render()}
 else if(t.dataset.file!==undefined&&t.files[0]){const f=t.files[0],n=f.name.toLowerCase(),done=x=>{S.brief=x;S.ex=null;S.msg="Loaded "+f.name+". Review the text, then extract requirements.";render()},bad=m=>{S.msg=m;render()};
  if(/\.docx$/.test(n))window.mammoth?f.arrayBuffer().then(b=>mammoth.extractRawText({arrayBuffer:b})).then(r=>done(r.value)).catch(()=>bad("Couldn’t read that Word file. Paste the text instead.")):bad("Word import isn’t available right now. Paste the text instead.");
  else if(/\.(txt|md)$/.test(n))f.text().then(done);
  else bad("That file type isn’t supported yet. Upload .docx, .txt or .md, or paste the text.")}});
render();
